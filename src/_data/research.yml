intro: |
  Our research group seeks new synthetic tools for building inorganic solids
  with challenging combinations of elements. This leads us into less
  explored regions of the periodic table and composition space where few or
  no compounds exist. These are fertile areas for exploratory efforts, but
  demand creative strategies for directing atoms with disparate reactivities
  into well-defined structures. The reward is new materials with unusual
  bonding, and structural building blocks that assemble into phases with
  exotic properties.

# ---------------------------------------------------------------------------
# Projects, shown between the opening paragraph and the three method blocks.
#   title, body (one paragraph), image (in src/assets/img/toc/), link (optional)
# ---------------------------------------------------------------------------
projects:
  - title: Anion ordering in mixed-chalcogen solids
    image: toc_jacs_2024b.png
    link: https://doi.org/10.1021/jacs.4c11617
    body: >
      Although chalcogens tend to form solid solutions in simple crystals,
      ordering does occur in structures with more than one anion site.
      Order-disorder phenomena affect their properties in numerous ways, but
      often go unnoticed and are poorly understood. The research team is
      seeking to establish a deeper understanding of the fundamental
      mechanisms that define atomic-scale ordering in chalcogenides and other
      extended solids. Our interdisciplinary approach, which unifies
      experiment and theory, is establishing chemical models for predicting
      local and long-range ordering phenomena.

  - title: Oxychalcogenides by design
    image: toc_angew_2026.png
    link: https://doi.org/10.1002/anie.1906484
    body: >
      Oxide and sulfide do not mix in the solid state, so almost all known
      oxychalcogenides are simple stacks of alternating layers. By reacting
      layered HfS2 with alkali carbonates, we insert rows of oxide into the
      layers and cut them into nanometer-wide ribbons, giving the A2Hf3Q6O
      family: two new structure types, band gaps tunable across the visible,
      band-edge emission, and transport that is effectively one-dimensional.

  - title: Porous oxides for selective oxidation
    image: ""
    link: https://doi.org/10.26434/chemrxiv-2025-51zh8
    body: >
      Converting molecular oxide precursors into microporous MoVBiOx gives
      catalysts with site-isolated active sites and high activity for
      oxidative dehydrogenation of ethane. The same atomic-level control we
      use for chalcogenides applies here: which metal sits where, and how
      ordered the framework is, decides selectivity.

# ---------------------------------------------------------------------------
# Research page (streamlined): three themes, text from site.yml -> about,
# each paired with a live structure (structures.yml) or an image.
# ---------------------------------------------------------------------------
themes:
  - key: synthesis
    structure: Cs2Hf3S6O
    caption: Cs₂Hf₃S₆O, an oxychalcogenide made by design
  - key: structure
    structure: KCu7Se4_phases
    caption: KCu₇Se₄, copper ordering on cooling from 293 K to 90 K
  - key: function
    structure: HfSSe
    caption: HfSSe, a layered mixed-anion semiconductor

areas:
  - id: synthesis
    title: Chemical reactivity
    short: High-temperature, flux, hydrothermal, and solution routes to solids nobody has made before.
    long: |
      Making a new compound is the first experiment, not preparation for
      one. We use sealed-tube, flux, hydrothermal, and solution routes, chosen
      for what the intermediates are and how fast they move, and we study why
      a reaction gives one phase rather than another.
    keywords: [Flux growth, Sealed-tube reactions, Hydrothermal synthesis, Retrosynthetic crystal chemistry]
    structure: Cs2Hf3S6O
    caption: Cs₂Hf₃S₆O — an oxychalcogenide made by design, from ribbons of HfS₆ and HfS₅O polyhedra
    paper: 19


  - id: crystal-growth
    title: Crystal growth
    short: Single crystals large enough to measure, grown by transport, flux, and slow cooling.
    long: |
      Single crystals are how we learn what a material really is: its
      structure, its anisotropy, and its intrinsic properties. We grow them by
      vapor transport, from molten fluxes, and by slow cooling, and we work at
      making them larger and cleaner.
    keywords: [Chemical vapor transport, Flux growth, Bridgman, Optical microscopy]
    image: research/crystals-mq2.jpg
    caption: Chalcogenide crystals from a flux growth, under the optical microscope
    paper: 25


  - id: discovery
    title: Materials discovery
    short: Machine learning and experiment together, to decide where in composition space to look next.
    long: |
      Composition space is too large to search by hand. We are building
      tools that use the group's own synthesis outcomes, successes and
      failures alike, to rank what to try next, and then we go to the furnace
      and find out.
    keywords: [Machine learning, High-throughput synthesis, Composition-space mapping, Data-driven design]
    image: research/crystals-mq1.jpg
    caption: A crop of one synthesis outcome among many — the raw material for the models
    paper: 23

  - id: structure
    title: Diffraction
    short: X-ray and neutron diffraction to find out where the atoms are — and where they aren't.
    long: |
      Every property has a structural explanation. Single-crystal and
      powder X-ray diffraction in the lab, synchrotron and neutron experiments
      at national facilities, and total scattering for the disordered cases,
      with particular attention to the vacancies and ordering that quick
      refinements miss.
    keywords: [Single-crystal XRD, Powder diffraction, Neutron scattering, Pair distribution function, Anion ordering]
    structure: pharmacosiderite
    caption: Ti-pharmacosiderite — TiO₆ octahedra and SiO₄ tetrahedra around an open channel
    paper: 18


  - id: site-design
    title: Site control
    short: Choosing which atoms occupy which sites — anions especially — as a switch for turning function on and off.
    long: |
      The cation gets the attention, but the anion sets the bonding. We
      make mixed-anion oxides, chalcogenides, and chalcohalides in which two or
      more anions occupy distinct sites, and we study how that ordering
      controls dimensionality, electronic structure, and stability.
    keywords: [Oxychalcogenides, Chalcohalides, Mixed-anion ordering, Dimensional reduction]
    structure: CsFeSTe
    caption: Cs₃Fe₄S₂.₅Te₃.₅ — sulfide and telluride on separate sites in one framework
    paper: 21


  - id: properties
    title: Properties
    short: Electronic, optical, thermal, and catalytic measurements that connect structure to function.
    long: |
      We measure what our materials do: electrical transport and Seebeck
      coefficient, optical absorption, thermal conductivity, and, for the
      oxides, catalytic activity and selectivity in flow reactors.
    keywords: [Thermoelectrics, Thermal conductivity, Seebeck, Optical band gap, Heterogeneous catalysis]
    structure: HfSSe
    caption: HfSSe — Hf layers between sheets of S and Se, a layered semiconductor
    paper: 24

