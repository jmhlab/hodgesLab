# ---------------------------------------------------------------------------
# Research page. The six sections mirror the six tiles on the homepage
# (src/_data/pillars.yml); the tile links point at these ids.
#
#   id:        anchor on the page — keep in sync with pillars.yml links
#   title:     section heading
#   short:     one line, used on the homepage research strip
#   long:      the full text; blank line between paragraphs
#   keywords:  shown as a tag line
#   structure: an entry in structures.yml to show alongside, OR
#   image:     a photo in src/assets/img/ (used when no structure is set)
#   caption:   line under the structure / photo
#   paper:     number of a paper in publications.yml to feature (optional)
# ---------------------------------------------------------------------------
intro: >
  We make new inorganic solids and work out how they form and what they do.
  The six threads below run through everything in the group; most projects
  pull on several at once.

areas:
  - id: synthesis
    title: Synthesis
    short: High-temperature, flux, hydrothermal, and solution routes to solids nobody has made before.
    long: |
      Making a new compound is the first experiment, not the preparation for
      one. We use sealed-tube and flux reactions above 1000 °C, hydrothermal
      and solvothermal chemistry, and solution routes, and we choose among
      them deliberately: which one gives access to a target depends on what
      the intermediates are and how fast they move.

      We are especially interested in why a reaction gives one phase rather
      than another. Retrosynthetic thinking, borrowed from molecular
      chemistry, turns out to work surprisingly well for extended solids
      once you know which building blocks are stable and how they connect.
    keywords: [Flux growth, Sealed-tube reactions, Hydrothermal synthesis, Retrosynthetic crystal chemistry]
    structure: Cs2Hf3S6O
    caption: Cs₂Hf₃S₆O — an oxychalcogenide made by design, from ribbons of HfS₆ and HfS₅O polyhedra
    paper: 19


  - id: crystal-growth
    title: Crystal growth
    short: Single crystals large enough to measure, grown by transport, flux, and slow cooling.
    long: |
      Single crystals are how we learn what a material really is. Powder tells
      you a phase exists; a crystal tells you its structure, its anisotropy,
      and its intrinsic properties without grain boundaries getting in the
      way.

      We grow crystals by chemical vapor transport, from molten fluxes, and by
      slow cooling of stoichiometric melts, and we spend real effort on making
      them larger and cleaner. Many of the photographs on this site are of
      crystals grown by students in their first year.
    keywords: [Chemical vapor transport, Flux growth, Bridgman, Optical microscopy]
    image: research/crystals-mq2.jpg
    caption: Chalcogenide crystals from a flux growth, under the optical microscope
    paper: 25


  - id: discovery
    title: Materials discovery
    short: Machine learning and experiment together, to decide where in composition space to look next.
    long: |
      Composition space is far too large to search by hand. We are building
      tools that use the group's own synthesis outcomes, successes and
      failures alike, together with published data to rank what to try next,
      and then we go to the furnace and find out.

      The aim is not to replace the chemist's intuition but to sharpen it, so
      that finding a new material becomes deliberate rather than lucky. This
      is the newest thread in the group and the one growing fastest.
    keywords: [Machine learning, High-throughput synthesis, Composition-space mapping, Data-driven design]
    image: research/crystals-mq1.jpg
    caption: A crop of one synthesis outcome among many — the raw material for the models
    paper: 23

  - id: structure
    title: Structure
    short: X-ray and neutron diffraction to find out where the atoms are — and where they aren't.
    long: |
      Every property has a structural explanation, so we measure structure
      carefully. Single-crystal and powder X-ray diffraction in the lab,
      synchrotron and neutron experiments at national facilities, and total
      scattering for the disordered cases.

      Vacancies, mixed occupancy, and local ordering are often where the
      interesting chemistry hides. Anion ordering in a mixed-anion compound
      can be invisible to a quick refinement and decisive for its band gap,
      so we look for it on purpose.
    keywords: [Single-crystal XRD, Powder diffraction, Neutron scattering, Pair distribution function, Anion ordering]
    structure: pharmacosiderite
    caption: Ti-pharmacosiderite — TiO₆ octahedra and SiO₄ tetrahedra around an open channel
    paper: 18


  - id: site-design
    title: Site design
    short: Choosing which atoms occupy which sites — anions especially — as a switch for turning function on and off.
    long: |
      The cation gets most of the attention in solid-state chemistry, but the
      anion sets the bonding. Swapping oxide for sulfide, or sulfide for
      telluride, changes covalency, band gap, and structure in ways that are
      large and, increasingly, predictable.

      We make mixed-anion oxides, chalcogenides, and chalcohalides in which
      two or more anions occupy distinct sites, and we study how that
      ordering controls dimensionality, electronic structure, and stability.
      This is the thread that ties most of the group's projects together.
    keywords: [Oxychalcogenides, Chalcohalides, Mixed-anion ordering, Dimensional reduction]
    structure: CsFeSTe
    caption: Cs₃Fe₄S₂.₅Te₃.₅ — sulfide and telluride on separate sites in one framework
    paper: 21


  - id: properties
    title: Properties
    short: Electronic, optical, thermal, and catalytic measurements that connect structure to function.
    long: |
      We measure what our materials do. Electrical transport and Seebeck
      coefficient for thermoelectrics, optical absorption for band gaps, and
      thermal conductivity, which in the best cases we can push toward the
      glassy limit through structural disorder.

      For the oxides, the measurement is often a catalytic one: activity and
      selectivity for oxidative dehydrogenation, run in flow reactors with
      the products followed by gas chromatography.
    keywords: [Thermoelectrics, Thermal conductivity, Seebeck, Optical band gap, Heterogeneous catalysis]
    structure: HfSSe
    caption: HfSSe — Hf layers between sheets of S and Se, a layered semiconductor
    paper: 24

