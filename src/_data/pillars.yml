# ---------------------------------------------------------------------------
# The "how we work" tiles under the Synthesis statement on the homepage.
# Each one is a technique we use or a question we're trying to answer, not a
# project. Keep titles to one or two words and blurbs to 2–3 sentences.
#   icon:  one of  ampoule | flux | loop | cell | site | wave
#   link:  where the tile goes (an anchor on the research page)
# ---------------------------------------------------------------------------
- title: synthesis
  icon: ampoule
  link: /research/#synthesis
  blurb: >
    Making a new solid is often the first experiment, not preparation for
    one. We use high-temperature solid-state reactions, flux chemistry,
    vapor transport, hydrothermal and high-pressure methods to reach
    targeted compositions, structures, and properties.

- title: crystal growth
  icon: flux
  link: /research/#crystal-growth
  blurb: >
    Growing high-quality single crystals is a science unto itself. Beyond
    enabling structure solutions for new compounds, large crystals let us
    measure intrinsic and direction-dependent properties, revealing
    structure–property relationships that make materials functional.

- title: materials discovery
  icon: loop
  link: /research/#discovery
  blurb: >
    Reaction space has too many dimensions to explore one at a time. We
    combine design of experiments with machine learning and AI to optimize
    syntheses, target specific features, and uncover interconnected
    variables invisible to conventional approaches.

- title: structure
  icon: cell
  link: /research/#structure
  blurb: >
    Knowing which crystallographic sites atoms occupy is essential to
    understanding a material. We combine X‑ray scattering with Raman
    spectroscopy and HRTEM to elucidate structure–property relationships and
    how synthesis affects order–disorder behavior.

- title: site design
  icon: site
  link: /research/#site-design
  blurb: >
    Where atoms reside in a crystal can matter as much as which atoms are
    present. Through systematic substitution and single-crystal diffraction,
    we explore local ordering and turn what we learn into rules for
    constructing atomically precise materials.

- title: properties
  icon: wave
  link: /research/#properties
  blurb: >
    We connect atomic structure to function through thermal and electronic
    transport and magnetic susceptibility, while collaborations with
    engineers, spectroscopists, and others extend our reach into catalysis,
    optoelectronics, and beyond.
