# ---------------------------------------------------------------------------
# The "how we work" tiles under the Synthesis statement on the homepage.
# Each one is a technique we use or a question we're trying to answer, not a
# project. Keep titles to one or two words and blurbs to 2–3 sentences.
#   icon:  one of  ampoule | flux | loop | cell | site | wave
#   link:  where the tile goes (an anchor on the research page)
# ---------------------------------------------------------------------------
- title: synthesis
  icon: ampoule
  link: /research/#synthesis
  blurb: >
    Making a new solid is the first experiment, not the preparation for one.
    We use high-temperature, flux, hydrothermal, and solution routes, and we
    treat the question of why a reaction gives one phase and not another as
    science in its own right.

- title: crystal growth
  icon: flux
  link: /research/#crystal-growth
  blurb: >
    Single crystals are how we learn what a material really is. Growing them
    well, and large enough to measure, is a craft we take seriously, from
    chemical vapor transport to slow-cooled fluxes.

- title: materials discovery
  icon: loop
  link: /research/#discovery
  blurb: >
    Composition space is too large to search by hand. We pair experiment with
    machine learning to decide where to look next, so that finding a new
    material becomes deliberate rather than lucky.

- title: structure
  icon: cell
  link: /research/#structure
  blurb: >
    Every property has a structural explanation. X-ray and neutron
    diffraction on powders and single crystals tell us where the atoms are,
    and, just as often, where they aren't.

- title: site design
  icon: site
  link: /research/#site-design
  blurb: >
    Choosing which atoms sit on which sites, anions especially, is a switch
    for turning function on and off. Mixed-anion oxides, chalcogenides, and
    halides let us tune bonding one site at a time.

- title: properties
  icon: wave
  link: /research/#properties
  blurb: >
    We measure what our materials do: electronic transport, optical response,
    and catalytic activity. The goal is a line from atomic arrangement to
    function that we can draw with confidence.
