# ---------------------------------------------------------------------------
# Site-wide settings. Edit freely; every page reads from here.
# ---------------------------------------------------------------------------
name: Hodges Group
tagline: Solid State Chemistry at Penn State
url: https://www.hodgeschemistry.com
description: >
  The Hodges Research Group at Penn State synthesizes microporous oxides, metal
  chalcogenides, and multi-anion materials for energy-related applications
  including thermoelectrics and heterogeneous catalysis.

# Headline on the homepage. Each line stays on one line on desktop; a "|" marks
# where it may break on phones.
hero:
  line1: Hodges Group
  line2: Exploring the Periodic Table|with Solid State Chemistry
  kicker: ""
  blurb: ""
  # Backdrop. If `photo` is set, that image (in src/assets/img/hero/) is used;
  # leave it blank to fall back to the 3D structure named below.
  photo: mq_2_2.jpg
  photo_focus: "50% 50%"        # which part of the photo stays centred when cropped (desktop)
  photo_phone: mq_2_2_phone.jpg   # optional: a different crop of the photo for phones (blank = use photo)
  photo_focus_phone: "50% 50%"  # focus point for the phone crop (left 0% … right 100%)
  photo_caption: ""        # leave blank for no caption
  # which structure sits behind the headline when no photo is set (see structures.yml)
  structure: KCu7Se4

# "About" band under the hero: a few short headed statements. Each has a
# one-word heading and one paragraph. Wrap a phrase in *asterisks* for italics.
about:
  - key: synthesis
    heading: Synthesis
    body: >
      We prepare inorganic solids by colloidal chemistry, hydrothermal
      synthesis, high-temperature solid-state reactions, growth from molten
      flux media, and high-pressure heating, choosing the route that gives
      access to the target composition and structure.

  - key: structure
    heading: Structure
    body: >
      We characterize what we make by powder and single-crystal X-ray
      diffraction, thermal analysis, vibrational and absorption
      spectroscopies, and electron microscopy, with particular attention to
      site occupancy and order-disorder features that a routine refinement
      can miss.

  - key: function
    heading: Function
    body: >
      We measure variable-temperature thermal and electronic transport,
      photoluminescence, adsorption, and surface area, connecting composition
      and structure to performance in optoelectronics, thermoelectrics, and
      heterogeneous catalysis.

# Papers to read on the homepage: paper numbers from publications.yml, in the
# order you want them shown. Leave empty to show the three most recent.
featured_papers: [26, 25, 22]

# Recruiting banner
recruiting:
  headline: We can make anything. Come learn how.
  sub: We're looking for students interested in materials synthesis and solid-state chemistry. Contact Jim directly to learn more about joining the group.
  button: Contact Jim

contact:
  name: James M. Hodges
  email: hodges@psu.edu
  address: Benkovic Building, University Park, PA 16802
  scholar: https://scholar.google.com/citations?user=X3Gtbc8AAAAJ&hl=en

# Main navigation (order matters)
nav:
