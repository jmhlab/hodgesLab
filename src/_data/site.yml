# ---------------------------------------------------------------------------
# Site-wide settings. Edit freely; every page reads from here.
# ---------------------------------------------------------------------------
name: Hodges Group
tagline: Solid State Chemistry at Penn State
url: https://www.hodgeschemistry.com
description: >
  The Hodges Research Group at Penn State synthesizes microporous oxides, metal
  chalcogenides, and multi-anion materials for energy-related applications
  including thermoelectrics and heterogeneous catalysis.

# Headline on the homepage. Each line stays on one line on desktop; a "|" marks
# where it may break on phones.
hero:
  line1: Exploring the|Periodic Table
  line2: with Solid State|Chemistry
  kicker: Hodges Research Group · Department of Chemistry
  blurb: We can make anything.
  # Backdrop. If `photo` is set, that image (in src/assets/img/hero/) is used;
  # leave it blank to fall back to the 3D structure named below.
  photo: mq_2_2.jpg
  photo_focus: "50% 50%"        # which part of the photo stays centred when cropped (desktop)
  photo_phone: mq_2_2_phone.jpg   # optional: a different crop of the photo for phones (blank = use photo)
  photo_focus_phone: "50% 50%"  # focus point for the phone crop (left 0% … right 100%)
  photo_caption: ""        # leave blank for no caption
  # which structure sits behind the headline when no photo is set (see structures.yml)
  structure: KCu7Se4

# "About" band under the hero: a few short headed statements. Each has a
# one-word heading and one paragraph. Wrap a phrase in *asterisks* for italics.
about:
  - key: synthesis
    heading: Synthesis.
    body: >
      The Hodges Group develops new methods for preparing well-defined
      inorganic solids across all length scales. Our work spans solution
      chemistry, solid-state synthesis, and crystal growth over wide ranges of
      temperature and pressure. Machine learning and statistical methods allow
      us to navigate these multidimensional reaction spaces. *We make new
      things.* Access to new materials enables new science and technology,
      placing us at the center of collaborative research that addresses major
      challenges in energy, the environment, and sustainable resources.

  - key: structure
    heading: Structure.
    body: >
      Understanding a new material begins with determining its structure.
      *Without crystallographic characterization, there is no discovery.* We
      combine single-crystal growth with X-ray diffraction, total scattering,
      and spectroscopy to characterize newly synthesized materials.
      Well-defined structures allow us to determine how subtle order–disorder
      features influence electrical, optical, and catalytic properties.

  - key: function
    heading: Function.
    body: >
      Well-defined crystalline solids are platforms for studying electronic
      and optical phenomena and allow us to correlate these properties with
      specific structural and chemical features. Careful measurement of
      absorption and emission, electronic and thermal transport, and catalytic
      behavior lets us connect crystallographic and local structure to
      material function. We work closely with physicists, engineers, and
      computational scientists to translate fundamental discoveries into
      advances in energy-related applications. *Our group serves as the
      materials engine for these efforts.*

# Papers to read on the homepage: paper numbers from publications.yml, in the
# order you want them shown. Leave empty to show the three most recent.
featured_papers: [25, 24, 22, 19, 20, 23]   # three columns; items 4–6 sit beneath 1–3

