# ---------------------------------------------------------------------------
# Site-wide settings. Edit freely; every page reads from here.
# ---------------------------------------------------------------------------
name: Hodges Group
tagline: Solid State Chemistry at Penn State
url: https://www.hodgeschemistry.com
description: >
  The Hodges Research Group at Penn State synthesizes microporous oxides, metal
  chalcogenides, and multi-anion materials for energy-related applications
  including thermoelectrics and heterogeneous catalysis.

# Headline on the homepage. Each line stays on one line on desktop; a "|" marks
# where it may break on phones.
hero:
  line1: Exploring the|Periodic Table
  line2: with Solid State|Chemistry
  kicker: "// Hodges Research Group — Department of Chemistry"
  blurb: We can make anything.
  # Backdrop. If `photo` is set, that image (in src/assets/img/hero/) is used;
  # leave it blank to fall back to the 3D structure named below.
  photo: mq_4.jpg
  photo_focus: "50% 50%"        # which part of the photo stays centred when cropped (desktop)
  photo_phone: mq_4_phone.jpg   # optional: a different crop of the photo for phones (blank = use photo)
  photo_focus_phone: "50% 50%"  # focus point for the phone crop (left 0% … right 100%)
  photo_caption: ""        # leave blank for no caption
  # which structure sits behind the headline when no photo is set (see structures.yml)
  structure: KCu7Se4

# "About" band under the hero: a few short headed statements. Each has a
# one-word heading and one paragraph. Wrap a phrase in *asterisks* for italics.
about:
  - key: synthesis
    heading: Synthesis.
    body: >
      The Hodges Group discovers new inorganic solids and develops chemical
      strategies to control their properties and open new regions of
      materials space. We approach synthesis as a scientific problem in its
      own right, using high-temperature solid-state and solution chemistries,
      crystal-growth design, and increasingly machine learning and AI tools to
      accelerate methods development and break through conventional synthetic
      barriers. *We make new things.* Access to new matter—and the ability to
      control its chemistry at the atomic scale—allows us to uncover how
      structure gives rise to function and create new opportunities for
      solving important problems.

  - key: structure
    heading: Structure.
    body: >
      Synthesis and structure are inseparable. Without crystallographic
      characterization, there is no discovery. We determine what we make at
      the atomic scale, from long-range crystal structures to local
      order–disorder phenomena, because we cannot understand how a material
      behaves without first knowing precisely what it is. The combination of
      new matter and precise structural knowledge creates unique platforms for
      technological advance. Through invention of new materials and their
      structural characterization, we uncover new structure–function
      relationships, and provide the materials foundation for breakthroughs
      across disciplines.

  - key: collaboration
    heading: Collaboration.
    body: >
      Important problems rarely belong to a single discipline. By discovering
      new materials and establishing precisely what they are, we create
      platforms for chemists, physicists, engineers, and computational
      scientists to ask questions that were not previously possible. We build
      collaborations around these opportunities, combining complementary
      expertise to connect fundamental chemistry with problems in energy,
      catalysis, electronics, and beyond. Our group serves as a materials
      engine for these efforts: creating new matter, defining it at the atomic
      scale, and establishing the structure–function relationships that
      reveal what it can do and why.

# Papers to read on the homepage: paper numbers from publications.yml, in the
# order you want them shown. Leave empty to show the three most recent.
featured_papers: [25, 24, 22, 19, 20, 23]   # three columns; items 4–6 sit beneath 1–3

