# ---------------------------------------------------------------------------
# Site-wide settings. Edit freely; every page reads from here.
# ---------------------------------------------------------------------------
name: Hodges Group
tagline: Solid State Chemistry at Penn State
url: https://www.hodgeschemistry.com
description: >
  The Hodges Research Group at Penn State synthesizes microporous oxides, metal
  chalcogenides, and multi-anion materials for energy-related applications
  including thermoelectrics and heterogeneous catalysis.

# Headline on the homepage. Each line stays on one line on desktop; a "|" marks
# where it may break on phones.
hero:
  line1: Exploring the|Periodic Table
  line2: with Solid State|Chemistry
  kicker: "// Hodges Research Group — Department of Chemistry"
  blurb: We can make anything.
  # Backdrop. If `photo` is set, that image (in src/assets/img/hero/) is used;
  # leave it blank to fall back to the 3D structure named below.
  photo: mq_4.jpg
  photo_focus: "50% 50%"      # which part of the photo stays centred when cropped
  photo_caption: ""        # leave blank for no caption
  # which structure sits behind the headline when no photo is set (see structures.yml)
  structure: KCu7Se4

# "About" band under the hero. heading is one word; body is one paragraph.
about:
  heading: Synthesis.
  # Paragraphs are separated by a blank line.
  body: |
    The Hodges Group discovers new inorganic solids and develops a fundamental
    understanding of how they form and function. We approach synthesis as a
    scientific problem in its own right, combining crystal growth,
    high-temperature and solution synthesis, crystallography, and
    physical-property measurements to connect atomic structure with electronic,
    optoelectronic, and catalytic behavior.

    A central goal of our research is to achieve atomic-level control over
    anion chemistry. By controlling which anions are incorporated into a solid
    and where they reside within its structure, we seek to understand how
    subtle changes in local chemistry can switch functionality on, off, or into
    entirely new regimes. Increasingly, we combine experiment with machine
    learning and AI to navigate complex composition spaces and make the
    discovery of new materials more deliberate and predictive. The goal is not
    simply to find new materials, but to understand where to look for them and
    how to design the chemistry that makes them useful.

