pi:
  name: James M. Hodges
  short: Jim
  title: Assistant Professor of Chemistry
  institution: The Pennsylvania State University
  photo: jim.jpg
  email: hodges@psu.edu
  # Paragraphs are separated by a blank line.
  bio: |
    Jim is a solid-state chemist interested in developing new synthetic
    methods and chemical reactivities to access new materials, and in
    inventing strategies to control where atoms reside within crystalline
    lattices to tune properties and create new functionality. His research
    group brings together exploratory synthesis, crystal growth, and
    crystallography with emerging AI-driven approaches to materials
    discovery.

    His background spans solid-state chemistry, porous materials for
    catalysis and separations, and nanomaterials, including industrial
    research at Honeywell UOP. He holds eight U.S. patents and has served as
    Chair of the Solid State Chemistry subdivision of the ACS Division of
    Inorganic Chemistry. Jim is also active in STEM education and outreach
    through collaborations with local educators, classroom lectures, and
    hands-on demonstrations.
  history:
    - years: 2020–present
      what: Assistant Professor of Chemistry, Penn State
    - years: 2019–2020
      what: R&D Scientist, New Materials Group, Honeywell UOP
    - years: 2016–2019
      what: Postdoctoral Fellow, Northwestern University · Mercouri G. Kanatzidis
    - years: 2012–2016
      what: Ph.D. Chemistry, Penn State · Raymond E. Schaak
    - years: 2008–2012
      what: B.S. Chemistry, Rider University
  links:
    - { label: Google Scholar, url: "https://scholar.google.com/citations?user=X3Gtbc8AAAAJ&hl=en" }
    - { label: LinkedIn, url: "https://www.linkedin.com/in/jameshodges12/" }
    - { label: Twitter, url: "https://twitter.com/HodgesChem" }

