pi:
  name: James M. Hodges
  short: Jim
  title: Assistant Professor of Chemistry
  institution: The Pennsylvania State University
  photo: jim.jpg
  email: hodges@psu.edu
  # Paragraphs are separated by a blank line.
  bio: |
    Jim is a solid-state chemist. His group develops synthetic methods for
    new inorganic solids and strategies for controlling where atoms sit in
    a crystal, combining exploratory synthesis, crystal growth, and
    crystallography with data-driven approaches to materials discovery.

    Before Penn State he was a Senior Scientist at Honeywell UOP, where he
    led materials discovery for catalysis and separations; that work produced
    four issued U.S. patents. He has served as Chair of the Solid State
    Chemistry subdivision of the ACS Division of Inorganic Chemistry.
  history:
    - years: 2020–present
      what: Assistant Professor of Chemistry, Penn State
    - years: 2019–2020
      what: R&D Scientist, New Materials Group, Honeywell UOP
    - years: 2016–2019
      what: Postdoctoral Fellow, Northwestern University · Mercouri G. Kanatzidis
    - years: 2012–2016
      what: Ph.D. Chemistry, Penn State · Raymond E. Schaak
    - years: 2008–2012
      what: B.S. Chemistry, Rider University
  links:
    - { label: Google Scholar, url: "https://scholar.google.com/citations?user=X3Gtbc8AAAAJ&hl=en" }

